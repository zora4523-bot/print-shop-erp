name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: print_shop_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d print_shop_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/print_shop_erp_ci
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
      AUTH_SECRET: ci-only-auth-secret-not-for-production-2026
      AUTH_TRUST_HOST: "true"
      SEED_ADMIN_USERNAME: ci-admin
      SEED_ADMIN_PASSWORD: ci-only-admin-password-not-for-production
      BACKGROUND_JOBS_MODE: inline
      NOTIFICATION_MOCK_MODE: "true"
      CDR_BUNDLE_MOCK_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          mkdir -p .review
          pnpm audit --prod --json > .review/dependency-audit.json

      - name: Install browser and PDF runtime dependencies
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm exec puppeteer browsers install chrome

      - name: Generate and validate Prisma client
        run: |
          pnpm exec prisma generate
          pnpm exec prisma validate

      - name: Verify the complete fresh migration chain
        env:
          FRESH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
          FRESH_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_ci'
          pnpm test:migrations:fresh

      - name: Static quality gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm check:architecture
          pnpm test:backup
          pnpm lint
          pnpm typecheck

      - name: Generate dead-code evidence
        run: pnpm check:dead-code

      - name: Prepare isolated database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Audit review data integrity
        run: pnpm audit:review-data

      - name: Unit, regression, and PostgreSQL tests with coverage
        run: pnpm exec vitest run --coverage --maxWorkers=2 --reporter=default --reporter=json --outputFile=.review/unit-tests.json

      - name: Browser component contracts
        run: pnpm test:browser --no-file-parallelism --reporter=default --reporter=json --outputFile=.review/browser-components.json

      - name: Prepare the disposable browser database and fixture prices
        run: |
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Production build, business E2E and six-viewport gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # Existing print baselines are Darwin-only and run in print-darwin below.
        # CLI grep-invert replaces the config filter, so retain both exclusions.
        run: pnpm test:release --grep-invert 'OrderPrintLayout 截图回归|deterministic external sales price tier fixture'

      - name: Durable worker queue, retry and authorized artifact downloads
        env:
          E2E_CANDIDATE_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:release:durable

      - name: Cross-browser print compatibility
        run: pnpm test:compat

      - name: Development-only visual fixtures
        run: pnpm test:release:dev-fixtures

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            .review/
            coverage/
            playwright-report/
            test-results/
            playwright-report-durable/
            test-results-durable/
            .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  print-darwin:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/print_shop_erp_print_ci
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/erp_e2e_print_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_print_ci
      FRESH_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/erp_e2e_print_ci
      FRESH_DATABASE_CONFIRM_DATABASE: erp_e2e_print_ci
      E2E_BASE_URL: http://127.0.0.1:3200
      AUTH_SECRET: ci-only-auth-secret-not-for-production-2026
      AUTH_TRUST_HOST: "true"
      SEED_ADMIN_USERNAME: ci-admin
      SEED_ADMIN_PASSWORD: ci-only-admin-password-not-for-production
      BACKGROUND_JOBS_MODE: inline
      NOTIFICATION_MOCK_MODE: "true"
      CDR_BUNDLE_MOCK_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
          pnpm exec prisma generate
          pnpm exec prisma validate

      - name: Install PostgreSQL 16
        run: |
          brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"

      - name: Start a dedicated loopback PostgreSQL cluster
        # macOS runners cannot use Docker service containers. This job owns
        # only its temporary cluster and port, never the Homebrew service data.
        run: |
          : "${RUNNER_TEMP:?GitHub runner temp is required}"
          initdb -D "$RUNNER_TEMP/erp-print-pg" -U postgres -A trust --encoding=UTF8 --locale=C
          pg_ctl -D "$RUNNER_TEMP/erp-print-pg" -l "$RUNNER_TEMP/erp-print-pg.log" -o '-h 127.0.0.1 -p 55432' -w start
          createdb -h 127.0.0.1 -p 55432 -U postgres print_shop_erp_print_ci
          createdb -h 127.0.0.1 -p 55432 -U postgres erp_e2e_print_ci

      - name: Migrate and prepare disposable print fixtures
        run: |
          pnpm test:migrations:fresh
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Record print runtime versions
        run: |
          mkdir -p .review
          {
            sw_vers
            uname -m
            node --version
            pnpm --version
            pnpm exec next --version
            psql --version
          } > .review/print-runtime.txt

      - name: Production build and existing Darwin print baselines
        # Use the release config's controlled build/start and original chromium
        # project name. Missing or changed baselines fail; none are approved here.
        run: pnpm test:release tests/visual/order-print.spec.ts --project=chromium --update-snapshots=none

      - name: Stop and remove this job's PostgreSQL cluster
        if: always()
        run: |
          : "${RUNNER_TEMP:?GitHub runner temp is required}"
          ERP_PRINT_PG_DATA="$RUNNER_TEMP/erp-print-pg"
          if [[ -f "$ERP_PRINT_PG_DATA/postmaster.pid" ]]; then
            "$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$ERP_PRINT_PG_DATA" -m fast -w stop
          fi
          rm -rf -- "$ERP_PRINT_PG_DATA"

      - name: Upload Darwin print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-print-darwin-${{ github.sha }}
          path: |
            .review/print-runtime.txt
            .review/playwright-release.json
            playwright-report/release/
            test-results/release/
            ${{ runner.temp }}/erp-print-pg.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
