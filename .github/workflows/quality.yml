name: Quality

# Phase 1 of the CI speed-up (DECISIONS 2026-09-19): fast gates fail in minutes
# instead of after the 40-minute E2E step, pull requests gate on two
# representative viewports, and `main` runs all six after the merge.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/print_shop_erp_ci
  AUTH_SECRET: ci-only-auth-secret-not-for-production-2026
  AUTH_TRUST_HOST: "true"
  SEED_ADMIN_USERNAME: ci-admin
  SEED_ADMIN_PASSWORD: ci-only-admin-password-not-for-production
  BACKGROUND_JOBS_MODE: inline
  NOTIFICATION_MOCK_MODE: "true"
  CDR_BUNDLE_MOCK_MODE: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: Asia/Shanghai

jobs:
  # Runs on pull requests and on `main`. No database, no browsers: this is the
  # job that answers "did lint / typecheck / architecture break?" first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: |
          mkdir -p .review
          pnpm audit --prod --json > .review/dependency-audit.json

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Static quality gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm check:architecture
          pnpm test:backup
          pnpm lint
          pnpm typecheck

      - name: Check dead-code candidates against existing inventory
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm check:dead-code --check

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-static-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_e2e_unit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_e2e_unit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # Same variables the single-job workflow exposed while the unit suite ran.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_unit
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Verify the complete fresh migration chain
        env:
          FRESH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
          FRESH_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_ci'
          pnpm test:migrations:fresh

      - name: Prepare isolated database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Audit review data integrity
        run: pnpm audit:review-data

      - name: Unit, regression, and PostgreSQL tests with coverage
        run: |
          mkdir -p .review
          pnpm exec vitest run --coverage --maxWorkers=2 --reporter=default --reporter=json --outputFile=.review/unit-tests.json
          node scripts/check-blank-migration-tests.mjs

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-unit-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-unit-${{ github.sha }}
          path: |
            coverage/
            .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  browser-components:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: browser-components (${{ matrix.shard }}/2)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Install test browsers
        uses: ./.github/actions/browsers
        with:
          playwright: chromium

      - name: Browser component contracts
        run: |
          mkdir -p .review
          pnpm test:browser --no-file-parallelism --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=.review/browser-components.json

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-browser-components-${{ matrix.shard }}-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-browser-components-${{ matrix.shard }}-${{ github.sha }}
          path: .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # One release build shared by every E2E shard (phase 2, DECISIONS 2026-09-19).
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Production build for the release E2E server
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec tsx scripts/e2e-release-build.ts

      # upload-artifact does not preserve symlinks, and Turbopack links external
      # packages (sharp, ...) from .next-release/node_modules into node_modules/.pnpm.
      # Without the links the server fails with "Cannot find package 'detect-libc'"
      # on every page that touches an image. Ship a tarball instead; only the
      # bulky compiler caches are left out (cache/.rscinfo stays).
      - name: Pack the release build
        run: >-
          tar
          --exclude='.next-release/cache/turbopack'
          --exclude='.next-release/cache/images'
          --exclude='.next-release/cache/*.tsbuildinfo'
          --exclude='.next-release/cache/.tsbuildinfo'
          -czf next-release.tar.gz .next-release

      - name: Upload the release build
        uses: actions/upload-artifact@v4
        with:
          name: next-release-${{ github.sha }}
          path: next-release.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Business E2E plus the pull-request viewport gate (375x667 and 1280x800 for
  # both shells), sharded by measured duration: chromium ~12.6 min over three
  # shards, each administrator viewport ~3-4 min, worker + no-JS under 1 min.
  # Every shard owns its runner, database and server, so `workers: 1` and the
  # shared-database constraint inside a shard are unchanged. All six viewports
  # run in `viewports-main` after the merge.
  e2e:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: chromium-1
            args: --project=chromium --shard=1/3
          - shard: chromium-2
            args: --project=chromium --shard=2/3
          - shard: chromium-3
            args: --project=chromium --shard=3/3
          - shard: admin-375x667
            args: --project=admin-375x667
          - shard: admin-1280x800
            args: --project=admin-1280x800
          - shard: worker-nojs
            args: --project=no-js --project=worker-375x667 --project=worker-1280x800
    name: e2e (${{ matrix.shard }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: print_shop_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d print_shop_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
      E2E_PREBUILT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Install test browsers
        uses: ./.github/actions/browsers
        with:
          playwright: chromium
          puppeteer: "true"

      - name: Download the release build
        uses: actions/download-artifact@v4
        with:
          name: next-release-${{ github.sha }}

      - name: Unpack the release build
        run: |
          tar -xzf next-release.tar.gz
          rm next-release.tar.gz
          test -f .next-release/BUILD_ID

      - name: Prepare the regular and the disposable browser databases
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_ci'
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Business E2E and two-viewport gates (${{ matrix.shard }})
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # Existing print baselines are Darwin-only and run in print-darwin.yml.
        # CLI grep-invert replaces the config filter, so retain both exclusions.
        run: >-
          pnpm test:release ${{ matrix.args }}
          --grep-invert 'OrderPrintLayout 截图回归|deterministic external sales price tier fixture'

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-e2e-${{ matrix.shard }}-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-e2e-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Business E2E deliberately publishes successor wage books, so the durable
  # suite has always used its own baseline database; it now also has its own job.
  durable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: print_shop_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d print_shop_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_artifacts_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_artifacts_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Install test browsers
        uses: ./.github/actions/browsers
        with:
          playwright: chromium
          puppeteer: "true"

      - name: Prepare the regular and the disposable artifact databases
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_artifacts_ci'
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Durable worker queue, retry and authorized artifact downloads
        env:
          E2E_CANDIDATE_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:release:durable

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-durable-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-durable-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            playwright-report-durable/
            test-results-durable/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The only job that needs WebKit. PDFs here are rendered with Playwright's
  # Chromium (see playwright.compat.config.ts), so no Puppeteer Chrome.
  compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: print_shop_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d print_shop_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_compat_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_compat_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Install test browsers
        uses: ./.github/actions/browsers
        with:
          playwright: chromium webkit

      - name: Prepare the regular and the disposable compatibility databases
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_compat_ci'
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Cross-browser print compatibility
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:compat

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-compat-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-compat-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Development-server fixture routes; same two-viewport policy on pull requests.
  dev-fixtures:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: print_shop_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d print_shop_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_fixtures_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_fixtures_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Install test browsers
        uses: ./.github/actions/browsers
        with:
          playwright: chromium

      - name: Prepare the regular and the disposable fixture databases
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_fixtures_ci'
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Development-only visual fixtures (two viewports)
        run: >-
          pnpm test:release:dev-fixtures
          --project=admin-375x667
          --project=admin-1280x800

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-dev-fixtures-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dev-fixtures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # After the merge: the full six-viewport gate for both shells, plus the
  # development fixtures at all six administrator viewports.
  viewports-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: print_shop_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d print_shop_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_ci
      E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node, pnpm and the Prisma client
        uses: ./.github/actions/setup

      - name: Install test browsers
        uses: ./.github/actions/browsers
        with:
          playwright: chromium
          puppeteer: "true"

      - name: Prepare the regular and the disposable browser databases
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_ci'
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare

      - name: Production build and six-viewport gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm test:release
          --project=worker-375x667
          --project=worker-393x852
          --project=worker-768x1024
          --project=worker-1024x768
          --project=worker-1280x800
          --project=worker-1920x1080
          --project=admin-375x667
          --project=admin-393x852
          --project=admin-768x1024
          --project=admin-1024x768
          --project=admin-1280x800
          --project=admin-1920x1080
          --grep-invert 'OrderPrintLayout 截图回归|deterministic external sales price tier fixture'

      - name: Prepare an independent fixture database
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e_fixtures_ci
          E2E_DATABASE_CONFIRM_DATABASE: erp_e2e_fixtures_ci
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_e2e_fixtures_ci'
          pnpm test:e2e:preflight
          DATABASE_URL="$E2E_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
          pnpm test:e2e:prepare
          echo "E2E_DATABASE_URL=$E2E_DATABASE_URL" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_CONFIRM_DATABASE=$E2E_DATABASE_CONFIRM_DATABASE" >> "$GITHUB_ENV"

      - name: Development-only visual fixtures (six viewports)
        run: pnpm test:release:dev-fixtures

      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-viewports-main-${{ github.sha }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-viewports-main-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
