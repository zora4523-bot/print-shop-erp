name: Install test browsers on demand
description: >-
  Restores Playwright / Puppeteer browsers from cache and installs only what the
  calling job needs. WebKit is only for the compat job; Puppeteer Chrome is only
  for jobs that render PDFs (business E2E, durable, compat).

inputs:
  playwright:
    description: Space-separated Playwright browsers, e.g. "chromium" or "chromium webkit". Empty skips Playwright.
    required: false
    default: chromium
  puppeteer:
    description: Set to "true" to install Puppeteer's Chrome for PDF rendering.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve browser versions
      id: versions
      shell: bash
      run: |
        echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "puppeteer=$(node -p "require('puppeteer/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      if: inputs.playwright != ''
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}-${{ inputs.playwright }}

    # Browser binaries are cached; their apt system libraries are not, so the
    # cache-hit path still installs OS dependencies (no browser download).
    - name: Install Playwright browsers and system dependencies
      if: inputs.playwright != '' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps ${{ inputs.playwright }}

    - name: Install Playwright system dependencies only
      if: inputs.playwright != '' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps ${{ inputs.playwright }}

    - name: Restore Puppeteer Chrome
      if: inputs.puppeteer == 'true'
      id: puppeteer-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ steps.versions.outputs.puppeteer }}

    - name: Install Puppeteer Chrome
      if: inputs.puppeteer == 'true' && steps.puppeteer-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec puppeteer browsers install chrome
